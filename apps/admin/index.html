<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laxmi Admin — Payroll &amp; Operations</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Laxmi Enterprise Master Administrative Portal: Payroll, Contractor Settlements, Fleet &amp; Multi-Spreadsheet Cloud Database Sync" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Laxmi Admin" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('✅ Admin PWA ServiceWorker registered:', reg.scope))
            .catch((err) => console.warn('⚠️ Admin PWA ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
