name: 📊 Weekly Dependency Update Check

on:
  schedule:
    # Every Sunday at 7:00 AM IST (1:30 AM UTC)
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    name: 🔄 Check for Outdated Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check for outdated packages
        id: outdated
        run: |
          echo "## 📦 Outdated Dependencies Report" >> $GITHUB_STEP_SUMMARY
          echo "**Generated**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run outdated check and capture output
          npm outdated --json > outdated.json 2>/dev/null || true
          
          # Count outdated packages
          COUNT=$(python3 -c "import json,sys; d=json.load(open('outdated.json')) if open('outdated.json').read().strip() else {}; print(len(d))" 2>/dev/null || echo "0")
          
          echo "**Total Outdated**: $COUNT packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$COUNT" -gt "0" ]; then
            echo "| Package | Current | Wanted | Latest |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYEOF'
          import json
          with open("outdated.json") as f:
            data = json.load(f)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as out:
            for pkg, info in data.items():
              current = info.get("current", "N/A")
              wanted = info.get("wanted", "N/A")
              latest = info.get("latest", "N/A")
              out.write(f"| {pkg} | {current} | {wanted} | {latest} |\n")
          PYEOF
          fi
          
          echo "OUTDATED_COUNT=$COUNT" >> $GITHUB_OUTPUT

      - name: Create issue if too many outdated packages
        if: steps.outdated.outputs.OUTDATED_COUNT > 10
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'dependencies',
              state: 'open'
            });
            
            const existingIssue = issues.data.find(i => i.title.includes('Dependency Update'));
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 Dependency Update Required - Weekly Scan',
                body: `## Weekly Dependency Scan Alert\n\nMore than 10 packages are outdated in the LaxmiEnterprise monorepo.\n\nRun \`npm outdated\` locally and then \`npm update\` to update compatible versions.\n\nFor major version updates, review changelogs carefully before upgrading.\n\n*Auto-generated by Weekly Dependency Check workflow on ${new Date().toDateString()}*`,
                labels: ['dependencies', 'automated']
              });
            }
