name: 🏷️ Auto Label PRs & Issues

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label:
    name: 🏷️ Apply Smart Labels
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label based on content
        uses: actions/github-script@v9
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const isPR = !!context.payload.pull_request;
            
            const payload = isIssue ? context.payload.issue : context.payload.pull_request;
            const title = (payload.title || '').toLowerCase();
            const body = (payload.body || '').toLowerCase();
            const content = title + ' ' + body;
            
            const labels = [];
            
            // Issue type detection
            if (title.includes('[bug]') || content.includes('not working') || content.includes('broken') || content.includes('error')) {
              labels.push('bug');
            }
            if (title.includes('[feature]') || content.includes('would be great') || content.includes('please add') || content.includes('feature request')) {
              labels.push('enhancement');
            }
            if (title.includes('[data]') || content.includes('google sheets') || content.includes('spreadsheet') || content.includes('attendance data')) {
              labels.push('google-sheets');
            }
            if (content.includes('performance') || content.includes('slow') || content.includes('loading')) {
              labels.push('performance');
            }
            if (content.includes('ui') || content.includes('design') || content.includes('layout') || content.includes('responsive')) {
              labels.push('ui/ux');
            }
            if (content.includes('security') || content.includes('vulnerability') || content.includes('auth')) {
              labels.push('security');
            }
            if (content.includes('document') || content.includes('readme') || content.includes('wiki')) {
              labels.push('documentation');
            }
            
            // PR-specific labeling based on changed files
            if (isPR) {
              const files = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: payload.number
              });
              
              const paths = files.data.map(f => f.filename);
              
              if (paths.some(p => p.startsWith('apps/admin/'))) labels.push('admin-app');
              if (paths.some(p => p.startsWith('apps/supervisor/'))) labels.push('supervisor-app');
              if (paths.some(p => p.startsWith('packages/shared/'))) labels.push('shared-package');
              if (paths.some(p => p.startsWith('google-sheets/'))) labels.push('google-sheets');
              if (paths.some(p => p.startsWith('.github/'))) labels.push('ci/cd');
              if (paths.some(p => p.endsWith('.md'))) labels.push('documentation');
              if (paths.some(p => p === 'package.json' || p === 'package-lock.json')) labels.push('dependencies');
              
              // Size label based on changed lines
              const totalChanges = files.data.reduce((sum, f) => sum + f.changes, 0);
              if (totalChanges < 10) labels.push('size: tiny');
              else if (totalChanges < 50) labels.push('size: small');
              else if (totalChanges < 200) labels.push('size: medium');
              else labels.push('size: large');
            }
            
            // Apply labels (ensure they exist first)
            if (labels.length > 0) {
              const uniqueLabels = [...new Set(labels)];
              try {
                if (isIssue) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: payload.number,
                    labels: uniqueLabels
                  });
                } else {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: payload.number,
                    labels: uniqueLabels
                  });
                }
                console.log(`Applied labels: ${uniqueLabels.join(', ')}`);
              } catch (err) {
                console.log('Some labels may not exist yet:', err.message);
              }
            }

  welcome:
    name: 👋 Welcome New Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Check if this is their first issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: context.payload.issue.user.login,
              state: 'all'
            });
            
            if (issues.data.length === 1) {
              // First issue from this user
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 Welcome to **Laxmi Enterprise**, @${context.payload.issue.user.login}! Thank you for opening your first issue.\n\nOur team will review this shortly. In the meantime:\n- 📖 Check the [Wiki](https://github.com/${context.repo.owner}/${context.repo.repo}/wiki) for documentation\n- 🌐 View the live app: [GitHub Pages](https://visionloop-org.github.io/LaxmiEnterprise/)\n- 🤝 Read our [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/master/CONTRIBUTING.md)\n\n*This is an automated message.*`
              });
            }
