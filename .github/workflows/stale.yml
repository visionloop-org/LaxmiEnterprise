name: 🔁 Stale Issue & PR Manager

on:
  schedule:
    # Every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Close Stale Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity in 30 days. It will be closed in 7 days if no further
            activity occurs. Thank you for your contributions to Laxmi Enterprise!
          stale-pr-message: >
            This pull request has been marked as stale due to 30 days of inactivity.
            Please rebase on the latest master and push to keep it active.
          close-issue-message: >
            This issue was closed because it has been stale for 7 days with no activity.
            Please re-open if this is still relevant.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'pinned,security,dependencies'
          operations-per-run: 100
