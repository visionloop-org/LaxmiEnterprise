name: 🔐 CodeQL Security Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Every Wednesday at 7:30 AM IST (2:00 AM UTC)
    - cron: '0 2 * * 3'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 🔎 Analyze JavaScript/JSX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          # Use 'security-extended' for more thorough scanning (includes XSS, injection, prototype pollution)
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - '**/*.min.js'
              - '**/*.min.mjs'
              - scripts/setup-github-labels.mjs

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

      - name: Report results
        run: |
          echo "## 🔐 CodeQL Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Language | JavaScript / JSX |" >> $GITHUB_STEP_SUMMARY
          echo "| Query suite | security-extended |" >> $GITHUB_STEP_SUMMARY
          echo "| Results | [Security tab](https://github.com/${{ github.repository }}/security/code-scanning) |" >> $GITHUB_STEP_SUMMARY
