services:
  mongodb:
    image: mongo:7
    container_name: laxmi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - laxmi-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./ServerSide
      dockerfile: Dockerfile
    container_name: laxmi-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/laxmi_enterprise
      - DEBUG=False
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - laxmi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  supervisor:
    build:
      context: .
      dockerfile: ./apps/supervisor/Dockerfile
    container_name: laxmi-supervisor
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - laxmi-network
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    container_name: laxmi-admin
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - laxmi-network
    restart: unless-stopped

networks:
  laxmi-network:
    driver: bridge

volumes:
  mongodb_data:
